<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Word - Đoán Từ</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="assets/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>

<body>
  <div id="flash-overlay" class="flash-overlay"></div>
  <div id="toast" class="toast"></div>
  <div class="container">
    <header>
      <div class="header-top">
        <img src="assets/images/hihi.png" id="web-logo" class="logo" alt="Guess Word Logo">
        <div class="header-actions">
          <div class="header-toggles">
            <div id="theme-toggle" class="theme-toggle" title="Switch Theme">🌙</div>
            <div id="lang-toggle" class="lang-toggle" title="Switch Language">US</div>
          </div>
          <div id="timer-display" class="timer">--</div>
        </div>
      </div>
      <h1>Đoán Từ</h1>
    </header>

      <!-- Home Phase -->
    <section id="home-phase" class="phase active">
      <div class="card">
        <h2>Chào mừng đến với Đoán Từ</h2>
        <div class="name-config">
          <label for="name-input" id="label-name">Tên của bạn:</label>
          <input type="text" id="name-input" placeholder="Nhập tên của bạn" maxlength="15">
        </div>
        <div class="action-group">
          <div class="host-config">
            <label for="chain-length-input" id="label-chain-length">Độ dài chuỗi:</label>
            <input type="number" id="chain-length-input" value="5" min="2" max="10">
          </div>
          <div class="host-config">
            <label for="time-limit-input" id="label-time-limit">Thời gian (giây):</label>
            <input type="number" id="time-limit-input" value="45" min="10" max="120" step="5">
          </div>
          <div class="host-config">
            <label for="custom-room-input" id="label-custom-room">Mã phòng:</label>
            <input type="text" id="custom-room-input" maxlength="15">
          </div>
          <button id="create-room-btn" class="btn primary">Tạo Phòng</button>
          <div class="divider">HOẶC</div>
          <div class="join-input">
            <input type="text" id="room-code-input" placeholder="Nhập mã phòng" maxlength="20">
            <button id="join-room-btn" class="btn secondary">Vào Phòng</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Lobby Phase -->
    <section id="lobby-phase" class="phase">
      <div class="card">
        <h2 id="lobby-status">Đang đợi đối thủ...</h2>
        <div id="room-info" class="room-info" style="display: none;">
          <p>Mã phòng: <strong id="display-room-code">---</strong></p>
        </div>

        <div id="word-submission" style="display: none;">
          <h3>Gửi chuỗi từ của bạn</h3>
          <p class="hint">Mỗi cụm từ có tối đa 2 từ. Quy tắc nối đuôi: Từ cuối của cụm trước bằng từ đầu của cụm sau.</p>
          <div id="word-inputs">
              <!-- Word inputs will be added here -->
          </div>
          <button id="add-word-btn" class="btn small" style="display: none;">Thêm từ</button>
          <button id="submit-words-btn" class="btn primary">Sẵn sàng!</button>
        </div>
      </div>
    </section>

      <!-- Battle Phase -->
      <section id="battle-phase" class="phase">

        <div class="game-status">
            <p id="turn-indicator">Đang đợi lượt...</p>
            <div id="message-log"></div>
        </div>

        <div class="battle-grid">
          <div class="player-area opponent-area">
            <h3>Từ của đối thủ</h3>
            <div id="opponent-words-display" class="words-container">
            <!-- Hidden words will be shown here -->
            </div>
            <div id="guess-input-container" class="guess-input-container" style="display: none;">
              <input type="text" id="guess-input" placeholder="Đoán một từ...">
              <button id="guess-btn" class="btn secondary">Đoán</button>
            </div>
          </div>

          <div class="player-area my-area">
            <h3>Từ của bạn</h3>
            <div id="my-words-display" class="words-container">
              <!-- Your words will be shown here -->
            </div>
          </div>
        </div>
      </section>

      <!-- Game Over Phase -->
      <section id="game-over-phase" class="phase">
          <div class="card">
            <h2 id="winner-text">Bạn đã thắng!</h2>
            <button id="play-again-btn" class="btn primary">Chơi lại</button>
          </div>
      </section>
      
      <footer>
        <div>
          <h5>DaoHieuIT</h5>
        </div>
        <div>
        </div>
      </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
