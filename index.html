<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simple Games - Homepage</title>
  <meta name="description" content="Chơi game P2P trực tuyến miễn phí cùng bạn bè. Trải nghiệm các trò chơi Đoán Số và Đoán Từ mượt mà trên nền tảng WebRTC không cần máy chủ.">
  <meta property="og:title" content="Simple Games - Homepage">
  <meta property="og:description" content="Chơi game P2P trực tuyến miễn phí cùng bạn bè. Trải nghiệm các trò chơi Đoán Số và Đoán Từ mượt mà trên nền tảng WebRTC không cần máy chủ.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="assets/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/84cb021d5f9af287ffff84b61beef6dc?family=clockicons" rel="stylesheet">
</head>

<body>
  <div id="toast" class="toast"></div>
  <div class="container">
    <header>
      <div class="header-top">
        <img src="assets/images/hihi.png" id="web-logo" class="logo" alt="Guess Word Logo">
        <div class="header-actions">
          <div class="header-toggles">
            <div id="theme-toggle" class="theme-toggle" title="Switch Theme">🌙</div>
            <div id="lang-toggle" class="lang-toggle" title="Switch Language">US</div>
          </div>
        </div>
      </div>
      <h1 id="main-title">Simple Games</h1>
    </header>

    <main class="game-selection">
      <div class="game-grid">
        <!-- Game 1: Guess Word -->
        <a href="games/guess-word/index.html" class="game-card">
          <div class="game-icon">🔤</div>
          <div class="game-info">
            <h3 data-en="Guess Word" data-vi="Đoán Từ">Guess Word</h3>
            <p data-en="Challenge your friends in a P2P word chain battle." data-vi="Thử thách bạn bè trong trận chiến nối từ P2P.">Challenge your friends in a P2P word chain battle.</p>
            <span class="btn primary small">Play Now</span>
          </div>
        </a>

        <!-- Game 2: Guess Number -->
        <a href="games/guess-number/index.html" class="game-card">
          <div class="game-icon">🔢</div>
          <div class="game-info">
            <h3 data-en="Guess Number" data-vi="Đoán Số">Guess Number</h3>
            <p data-en="Find the secret number using logic and intuition." data-vi="Tìm con số bí mật bằng logic và trực giác.">Find the secret number using logic and intuition.</p>
            <span class="btn primary small">Play Now</span>
          </div>
        </a>

        <!-- Game 3: Remember Numbers -->
        <a href="games/remember-numbers/index.html" class="game-card">
          <div class="game-icon">🧠</div>
          <div class="game-info">
            <h3 data-en="Remember Numbers" data-vi="Ghi Nhớ Số">Remember Numbers</h3>
            <p data-en="Recall and type a sequence of random numbers as fast as possible." data-vi="Ghi nhớ và nhập lại dãy số ngẫu nhiên nhanh nhất có thể.">Recall and type a sequence of random numbers as fast as possible.</p>
            <span class="btn primary small">Play Now</span>
          </div>
        </a>
      </div>
    </main>

    <footer>
      <div>
        <h5>DaoHieuIT</h5>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
  <!-- placeholder label aria-label -->
</body>

</html>
