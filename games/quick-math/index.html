<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tính Nhẩm - Quick Math</title>
  <meta name="description" content="Tính Nhẩm - Trận chiến tính nhẩm P2P kịch tính. Giải nhanh các phép toán cộng, trừ, nhân, chia để đánh bại đối thủ của bạn.">
  <meta property="og:title" content="Tính Nhẩm - Quick Math">
  <meta property="og:description" content="Tính Nhẩm - Trận chiến tính nhẩm P2P kịch tính. Giải nhanh các phép toán cộng, trừ, nhân, chia để đánh bại đối thủ của bạn.">
  <meta property="og:type" content="website">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="../../assets/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/84cb021d5f9af287ffff84b61beef6dc?family=clockicons" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
  <div id="flash-overlay" class="flash-overlay"></div>
  <div id="toast" class="toast"></div>
  <div class="container">
    <header>
      <div class="header-top">
        <img src="../../assets/images/hihi.png" id="web-logo" class="logo" alt="Logo">
        <div class="header-actions">
          <div id="timer-display" class="timer">00.000</div>
          <div class="header-toggles">
            <div id="theme-toggle" class="theme-toggle" title="Switch Theme">🌙</div>
            <div id="lang-toggle" class="lang-toggle" title="Switch Language">US</div>
          </div>
        </div>
      </div>
      <h1 id="game-title">Quick Math</h1>
    </header>

    <!-- Home Phase -->
    <section id="home-phase" class="phase active">
      <div class="card">
        <h2 id="welcome-text">Chào mừng đến với Tính Nhẩm</h2>
        
        <div class="name-config">
          <label for="name-input" id="label-name">Tên của bạn:</label>
          <input type="text" id="name-input" placeholder="Nhập tên của bạn" maxlength="15">
        </div>

        <div class="action-group">
          <!-- Cấu hình Độ khó -->
          <div class="host-config">
            <label for="difficulty-input" id="label-difficulty">Độ khó (1-3):</label>
            <input type="number" id="difficulty-input" value="2" min="1" max="3">
          </div>

          <!-- Cấu hình Số câu hỏi -->
          <div class="host-config">
            <label for="question-count-input" id="label-question-count">Số câu hỏi:</label>
            <input type="number" id="question-count-input" value="5" min="3" max="15">
          </div>

          <!-- Cấu hình Thời gian giới hạn -->
          <div class="host-config">
            <label for="time-limit-input" id="label-time-limit">Thời gian (giây):</label>
            <input type="number" id="time-limit-input" value="60" min="10" max="300" step="5">
          </div>

          <div class="host-config">
            <label for="custom-room-input" id="label-custom-room">Mã phòng:</label>
            <input type="text" id="custom-room-input" value="000" maxlength="15">
          </div>

          <button id="create-room-btn" class="btn primary">Tạo Phòng</button>
          
          <div class="divider">HOẶC</div>
          
          <div class="join-input">
            <label for="room-code-input" class="sr-only">Mã phòng để vào</label>
            <input type="text" id="room-code-input" placeholder="Nhập mã phòng" maxlength="20">
            <button id="join-room-btn" class="btn secondary">Vào Phòng</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Lobby Phase -->
    <section id="lobby-phase" class="phase">
      <div class="card">
        <h2 id="lobby-status">Đang đợi đối thủ...</h2>
        
        <div id="room-info" class="room-info" style="display: none;">
          <p id="room-id-label">Mã phòng: <strong id="display-room-code">---</strong></p>
          <div class="room-actions">
            <button id="copy-link-btn" class="btn secondary small">Copy Link</button>
            <button id="share-room-btn" class="btn secondary small">Send Via</button>
          </div>
        </div>

        <div id="players-list" class="players-list">
          <p><span id="player-host-name">Host: ---</span> <span class="badge host-badge">Host</span></p>
          <p><span id="player-guest-name">Guest: ---</span> <span class="badge guest-badge" id="guest-status-badge">Đang đợi...</span></p>
        </div>

        <div id="lobby-controls" class="lobby-controls" style="display: none;">
          <button id="start-game-btn" class="btn primary">Bắt Đầu Game</button>
        </div>
        
        <p class="hint" id="game-config-hint">Đang cấu hình phòng...</p>
      </div>
    </section>

    <!-- Play Phase -->
    <section id="battle-phase" class="phase">
      <!-- Tiến độ so sánh song song -->
      <div class="progress-container">
        <div class="progress-row">
          <span class="progress-label" id="label-progress-you">Bạn:</span>
          <div class="progress-bar-bg">
            <div id="my-progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
          <span class="progress-text" id="my-progress-text">0/5</span>
        </div>
        <div class="progress-row">
          <span class="progress-label" id="label-progress-opp">Đối thủ:</span>
          <div class="progress-bar-bg">
            <div id="opp-progress-bar" class="progress-bar-fill opponent-color" style="width: 0%;"></div>
          </div>
          <span class="progress-text" id="opp-progress-text">0/5</span>
        </div>
      </div>

      <!-- Phép tính chính -->
      <div class="equation-card">
        <div class="question-number" id="question-number-display">Câu 1</div>
        <div class="equation-display" id="equation-display">12 + 34 = ?</div>
        
        <div class="answer-input-row">
          <label for="math-answer-input" class="sr-only">Đáp án</label>
          <input type="number" id="math-answer-input" pattern="[0-9]*" inputmode="numeric" placeholder="?" autocomplete="off" autofocus>
        </div>
        <p class="input-hint" id="input-hint">Nhập đáp án và nhấn Enter hoặc nút gửi</p>
        <button id="submit-answer-btn" class="btn primary">Gửi</button>
      </div>
    </section>

    <!-- Game Over Phase -->
    <section id="game-over-phase" class="phase">
      <div class="card">
        <h2 id="winner-text">Người thắng! 🎉</h2>
        <div class="stats-container">
          <div class="stat-row">
            <span class="stat-name" id="stat-you-label">Bạn:</span>
            <span class="stat-value" id="stat-you-time">--.--s</span>
          </div>
          <div class="stat-row">
            <span class="stat-name" id="stat-opp-label">Đối thủ:</span>
            <span class="stat-value" id="stat-opp-time">--.--s</span>
          </div>
        </div>
        <button id="play-again-btn" class="btn primary" style="margin-top: 2.5rem;">Chơi lại</button>
      </div>
    </section>

    <footer>
      <div>
        <h5>DaoHieuIT</h5>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
