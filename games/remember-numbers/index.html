<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghi Nhớ Số - Remember Numbers</title>
  <meta name="description" content="Ghi Nhớ Số - Trận chiến ghi nhớ và nhập số thời gian thực P2P. Thử thách trí nhớ ngắn hạn và tốc độ gõ phím của bạn.">
  <meta property="og:title" content="Ghi Nhớ Số - Remember Numbers">
  <meta property="og:description" content="Ghi Nhớ Số - Trận chiến ghi nhớ và nhập số thời gian thực P2P. Thử thách trí nhớ ngắn hạn và tốc độ gõ phím của bạn.">
  <meta property="og:type" content="website">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="../../assets/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/84cb021d5f9af287ffff84b61beef6dc?family=clockicons" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
  <div id="flash-overlay" class="flash-overlay"></div>
  <div id="toast" class="toast"></div>
  <div class="container">
    <header>
      <div class="header-top">
        <img src="../../assets/images/hihi.png" id="web-logo" class="logo" alt="Remember Numbers Logo">
        <div class="header-actions">
          <div id="timer-display" class="timer">00.000</div>
          <div class="header-toggles">
            <div id="theme-toggle" class="theme-toggle" title="Switch Theme">🌙</div>
            <div id="lang-toggle" class="lang-toggle" title="Switch Language">US</div>
          </div>
        </div>
      </div>
      <h1 id="main-title">Remember Numbers</h1>
    </header>

    <!-- Home Phase -->
    <section id="home-phase" class="phase active">
      <div class="card">
        <h2 id="welcome-text">Chào mừng đến với Ghi Nhớ Số</h2>
        <div class="name-config">
          <label for="name-input" id="label-name">Tên của bạn:</label>
          <input type="text" id="name-input" placeholder="Nhập tên của bạn" maxlength="15">
        </div>
        <div class="action-group">
          <div class="host-config">
            <label for="sequence-length-input" id="label-sequence-length">Số lượng số (2-10):</label>
            <input type="number" id="sequence-length-input" value="4" min="2" max="10">
          </div>
          <div class="host-config">
            <label for="digits-input" id="label-digits">Số chữ số (1-5):</label>
            <input type="number" id="digits-input" value="2" min="1" max="5">
          </div>
          <div class="host-config">
            <label for="show-duration-input" id="label-show-duration">Thời gian nhớ (giây):</label>
            <input type="number" id="show-duration-input" value="5" min="1" max="30">
          </div>
          <div class="host-config">
            <label for="custom-room-input" id="label-custom-room">Mã phòng:</label>
            <input type="text" id="custom-room-input" value="000" maxlength="15">
          </div>
          <button id="create-room-btn" class="btn primary">Tạo Phòng</button>
          <div class="divider">HOẶC</div>
          <div class="join-input">
            <label for="room-code-input" class="sr-only">Mã phòng để vào</label>
            <input type="text" id="room-code-input" placeholder="Nhập mã phòng" maxlength="20">
            <button id="join-room-btn" class="btn secondary">Vào Phòng</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Lobby Phase -->
    <section id="lobby-phase" class="phase">
      <div class="card">
        <h2 id="lobby-status">Đang đợi đối thủ...</h2>
        <div id="room-info" class="room-info" style="display: none;">
          <p id="room-id-label">Mã phòng: <strong id="display-room-code">---</strong></p>
          <button id="copy-link-btn" class="btn secondary small">Copy Link</button>
        </div>

        <div id="word-submission" style="display: none;">
          <h3 id="submit-words-title">Sẵn sàng để bắt đầu</h3>
          <p class="hint" id="game-params-hint">Host sẽ cấu hình các tham số và bắt đầu.</p>
          <button id="submit-words-btn" class="btn primary" style="margin: 2rem auto 0;">Sẵn sàng!</button>
        </div>
      </div>
    </section>

    <!-- Battle Phase -->
    <section id="battle-phase" class="phase">
      <div class="game-status">
        <p id="turn-indicator">Đang chuẩn bị...</p>
      </div>

      <div class="battle-grid">
        <div class="player-area opponent-area">
          <h3 id="opponent-title" data-en="Opponent" data-vi="Đối thủ">Đối thủ</h3>
          <div id="opponent-sequence" class="sequence-container">
            <!-- Opponent sequence slots will be here -->
          </div>
        </div>

        <div class="player-area my-area">
          <h3 id="my-title" data-en="You" data-vi="Bạn">Bạn</h3>
          <div id="my-sequence" class="sequence-container">
            <!-- My sequence slots will be here -->
          </div>
        </div>
      </div>

      <div class="guess-input-container">
        <div class="word-row">
          <label for="guess-input" class="sr-only">Nhập số đoán</label>
          <input type="text" id="guess-input" placeholder="Nhập số..." autocomplete="off">
        </div>
        <button id="guess-btn" class="btn primary">Gửi</button>
      </div>
    </section>

    <!-- Game Over Phase -->
    <section id="game-over-phase" class="phase">
      <div class="card">
        <h2 id="winner-text">Người thắng! 🎉</h2>
        <p id="secret-reveal-text"></p>
        <button id="play-again-btn" class="btn primary">Chơi lại</button>
      </div>
    </section>

    <footer>
      <div>
        <h5>DaoHieuIT</h5>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
